packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  workerd: true
overrides:
  # Scoped, not blanket: brace-expansion has two live major lines in this
  # tree (1.x via the older minimatch@3, used by @eslint/config-array; 5.x
  # via minimatch@10, used by typescript-eslint) with incompatible APIs —
  # a blanket override to 5.x broke ESLint entirely (confirmed by testing).
  # Only the minimatch@10 chain gets patched here; minimatch@3's copy
  # (1.1.16, CVE-2026-14257) has no fix released within its own major line
  # — see .trivyignore for why that one stays accepted/documented instead.
  "minimatch@10>brace-expansion": ^5.0.8
