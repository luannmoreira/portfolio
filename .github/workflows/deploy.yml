name: Deploy

# Deliberately not on every push to main — ci.yml already gates every push
# with the full test suite; this workflow only fires when a version tag is
# pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`), so a deploy is
# a distinct, intentional action, not a side effect of merging. Both apps
# deploy together off one tag — split this per app later if the two ever
# need independent release cadences.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter portfolio build

      # Needed at compile time, not just for e2e: rehype-mermaid renders
      # Mermaid diagrams via a real headless browser during the MDX build,
      # and this repo's content includes one — matches ci.yml's blog job.
      - run: pnpm --filter blog exec playwright install --with-deps chromium

      - run: pnpm --filter blog build

      - name: Deploy portfolio
        run: pnpm exec wrangler pages deploy apps/portfolio/dist --project-name luanncurioso-portfolio --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy blog
        run: pnpm exec wrangler pages deploy apps/blog/dist --project-name luanncurioso-blog --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
