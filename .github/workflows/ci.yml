name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: Format (repo-wide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

  ui:
    name: UI package (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @portfolio/ui lint

      - run: pnpm --filter @portfolio/ui typecheck

      - run: pnpm --filter @portfolio/ui test

  i18n:
    name: i18n package (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @portfolio/i18n lint

      - run: pnpm --filter @portfolio/i18n typecheck

      - run: pnpm --filter @portfolio/i18n test

  portfolio:
    name: Portfolio (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter portfolio lint

      - run: pnpm --filter portfolio typecheck

      - run: pnpm --filter portfolio test

      - run: pnpm --filter portfolio build

  portfolio-e2e:
    name: Portfolio (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter portfolio exec playwright install --with-deps chromium

      - run: pnpm --filter portfolio e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: portfolio-playwright-report
          path: apps/portfolio/playwright-report/
          retention-days: 7

  blog:
    name: Blog (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Needed at compile time now, not just for e2e: rehype-mermaid (9.7)
      # renders Mermaid diagrams via a real headless browser during the MDX
      # build, and this repo's content now includes one.
      - run: pnpm --filter blog exec playwright install --with-deps chromium

      - run: pnpm --filter blog lint

      - run: pnpm --filter blog typecheck

      - run: pnpm --filter blog test

      - run: pnpm --filter blog build

  blog-e2e:
    name: Blog (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter blog exec playwright install --with-deps chromium

      - run: pnpm --filter blog e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blog-playwright-report
          path: apps/blog/playwright-report/
          retention-days: 7

  docker-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [portfolio-dev, blog-dev]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.target }}:ci

      # Caught real findings this way before: node:24-alpine's bundled npm
      # (removed in the Dockerfile since this project is pnpm-only) and a
      # stale-transitive-dependency bug where COPY . . without a
      # .dockerignore pulled the host's own node_modules into the image on
      # top of the freshly pnpm-installed ones.
      - name: Scan ${{ matrix.target }} with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.target }}:ci
          severity: CRITICAL,HIGH
          scanners: vuln
          trivyignores: .trivyignore
          exit-code: "1"
