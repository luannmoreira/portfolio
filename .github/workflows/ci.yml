name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portfolio:
    name: Portfolio (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter portfolio lint

      - run: pnpm --filter portfolio typecheck

      - run: pnpm --filter portfolio test

      - run: pnpm --filter portfolio build
