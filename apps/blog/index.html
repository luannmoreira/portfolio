<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Long-form engineering writing from Luann Curioso — architecture decisions, real bugs, and how this site itself gets built."
    />
    <title>Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint, synchronously — deciding after React
      // mounts would flash the wrong theme for a frame. Dark is this site's
      // default (unprefixed classes); this only ever needs to *add* a
      // `light` class, never remove one.
      //
      // This app and the portfolio share one origin (luanncurioso.dev, this
      // app under /blog) but are still two separate SPA bundles, so the
      // theme choice still needs to be read from localStorage on each one's
      // own boot — it's just no longer carried via a `?theme=` query param,
      // since localStorage itself is already shared across same-origin
      // pages.
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (stored === "light" || (!stored && !prefersDark)) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
