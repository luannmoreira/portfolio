<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Long-form engineering writing from Luann Curioso — architecture decisions, real bugs, and how this site itself gets built."
    />
    <link rel="canonical" href="https://luanncurioso.dev/blog" />
    <title>Blog</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blog" />
    <meta
      property="og:description"
      content="Long-form engineering writing from Luann Curioso — architecture decisions, real bugs, and how this site itself gets built."
    />
    <meta property="og:url" content="https://luanncurioso.dev/blog" />
    <meta
      property="og:image"
      content="https://luanncurioso.dev/apple-touch-icon.png"
    />
    <!-- Matches the portfolio's index.html: "summary", not
         "summary_large_image" — reuses the portfolio's apple-touch-icon.png
         (180x180), below the large-image card's minimum but above
         "summary"'s. The blog ships no OG-sized image of its own yet. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Blog" />
    <meta
      name="twitter:description"
      content="Long-form engineering writing from Luann Curioso — architecture decisions, real bugs, and how this site itself gets built."
    />
    <meta
      name="twitter:image"
      content="https://luanncurioso.dev/apple-touch-icon.png"
    />
    <!-- Fonts are self-hosted (@fontsource/*, imported in src/index.css) —
         no Google Fonts preconnect/stylesheet needed anymore. -->
    <script>
      // Runs before first paint, synchronously — deciding after React
      // mounts would flash the wrong theme for a frame. Dark is this site's
      // default (unprefixed classes); this only ever needs to *add* a
      // `light` class, never remove one.
      //
      // This app and the portfolio share one origin (luanncurioso.dev, this
      // app under /blog) but are still two separate SPA bundles, so the
      // theme choice still needs to be read from localStorage on each one's
      // own boot — it's just no longer carried via a `?theme=` query param,
      // since localStorage itself is already shared across same-origin
      // pages.
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (stored === "light" || (!stored && !prefersDark)) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
