<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Long-form engineering writing from Luann Curioso — architecture decisions, real bugs, and how this site itself gets built."
    />
    <title>Blog</title>
    <script>
      // Runs before first paint, synchronously — deciding after React
      // mounts would flash the wrong theme for a frame. Dark is this site's
      // default (unprefixed classes); this only ever needs to *add* a
      // `light` class, never remove one.
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (stored === "light" || (!stored && !prefersDark)) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
