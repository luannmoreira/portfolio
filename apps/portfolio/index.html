    <!-- "summary", not "summary_large_image" — apple-touch-icon.png is
         180x180, below Twitter's >=300x157 minimum for the large-image
         card, but comfortably above the 144x144 minimum for "summary". -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Luann Curioso" />
    <meta
      name="twitter:description"
      content="Luann Curioso's portfolio — software engineer with production front-end experience and an infrastructure background, from ShellHub to government platforms."
    />
    <meta
      name="twitter:image"
      content="https://luanncurioso.dev/apple-touch-icon.png"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Luann Curioso",
        "url": "https://luanncurioso.dev/",
        "jobTitle": "Software Engineer",
        "sameAs": [
          "https://github.com/luannmoreira",
          "https://linkedin.com/in/luanncurioso"
        ]
      }
    </script>
    <!-- Fonts are self-hosted (@fontsource/*, imported in src/index.css) —
         no Google Fonts preconnect/stylesheet needed anymore. -->
    <script>
      // Runs before first paint, synchronously — deciding after React
      // mounts would flash the wrong theme for a frame. Dark is this site's
      // default (unprefixed classes); this only ever needs to *add* a
      // `light` class, never remove one.
      //
      // This app and the blog share one origin (luanncurioso.dev, blog under
      // /blog) but are still two separate SPA bundles, so the theme choice
      // still needs to be read from localStorage on each one's own boot —
      // it's just no longer carried via a `?theme=` query param, since
      // localStorage itself is already shared across same-origin pages.
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (stored === "light" || (!stored && !prefersDark)) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
