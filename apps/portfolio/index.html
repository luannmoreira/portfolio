      rel="stylesheet"
    />
    <script>
      // Runs before first paint, synchronously — deciding after React
      // mounts would flash the wrong theme for a frame. Dark is this site's
      // default (unprefixed classes); this only ever needs to *add* a
      // `light` class, never remove one.
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (stored === "light" || (!stored && !prefersDark)) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
